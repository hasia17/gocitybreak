<!doctype html>
<!--
  PROTOTYPE — throwaway. Question: "What should the gocitybreak search page look like?"
  Three structurally different directions (A board, B postcard, C poster), switchable via ?variant=a|b|c,
  ?state=form|results|empty, ?theme=auto|light|dark. Real data: KRK -> Anywhere, 20 Nov - 13 Dec 2026, 2-3 nights.
-->
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kierunki wizualne gocitybreak</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=B612:wght@400;700&family=Young+Serif&family=Figtree:wght@400;500;600&family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0}
html{overflow-x:hidden}
body{background:var(--bg);font-family:inherit;font-size:16px;line-height:normal}
body{min-height:100vh;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.wrap{max-width:68rem;margin:0 auto;padding:0 16px}
.page{padding-bottom:7rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- prototype switcher (not part of the design) ---------- */
.proto{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);z-index:50;display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;
  background:#000;color:#fff;border:2px solid #fff;border-radius:999px;padding:6px 8px;font:500 13px/1 system-ui,sans-serif;box-shadow:0 6px 24px rgb(0 0 0/.35);max-width:calc(100vw - 16px)}
.proto button{background:transparent;border:0;color:#fff;padding:7px 10px;border-radius:999px;cursor:pointer}
.proto button[aria-pressed=true]{background:#fff;color:#000}
.proto .lbl{padding:0 6px;min-width:9.5rem;text-align:center}
.proto .sep{width:1px;height:18px;background:#555}
@media (max-width:600px){.proto{border-radius:14px;font-size:12px;width:calc(100vw - 16px)}.proto .lbl{min-width:0}.proto .sep{display:none}}

/* =====================================================================
   A — TABLICA ODLOTÓW: dense board table, wayfinding green, B612
   ===================================================================== */
[data-v=a]{--bg:#E9ECEF;--surface:#FFFFFF;--ink:#111820;--muted:#5B6672;--line:#C9D0D7;--accent:#0A7A55;--on-accent:#FFFFFF;--tile:#111820;--tile-ink:#F4F7F9;--focus:#0A7A55}
[data-v=a][data-t=dark]{--bg:#0C1118;--surface:#131B25;--ink:#E6EDF3;--muted:#8794A3;--line:#243141;--accent:#3DDC97;--on-accent:#06130D;--tile:#000;--tile-ink:#F5D9A8;--focus:#3DDC97}
[data-v=a]{background:var(--bg);color:var(--ink);font-family:'B612',system-ui,sans-serif;font-variant-numeric:tabular-nums}
.a-top{display:flex;justify-content:space-between;align-items:center;padding-block:18px;font-size:15px}
.a-top b{letter-spacing:.02em}
.a-lang{color:var(--muted)} .a-lang b{color:var(--ink)}
.a-hero{padding:48px 0 20px}
.a-hero h1{font-size:clamp(28px,5vw,44px);line-height:1.1;margin:0 0 8px;font-weight:700}
.a-hero p{margin:0;color:var(--muted)}
.a-modes{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0 12px}
.a-seg{display:inline-flex;border:1px solid var(--line);background:var(--surface)}
.a-seg button{border:0;background:transparent;padding:8px 14px;cursor:pointer;color:var(--muted)}
.a-seg button[aria-pressed=true]{background:var(--ink);color:var(--surface)}
.a-form{display:grid;grid-template-columns:1.4fr 1.4fr 1fr 1fr .8fr auto;background:var(--surface);border:1px solid var(--line)}
.a-cell{padding:10px 14px;border-right:1px solid var(--line);min-width:0}
.a-cell label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.a-cell .v{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a-cell .ph{color:var(--muted)}
.a-chip{display:inline-block;background:var(--bg);padding:1px 6px;margin-right:4px}
.a-go{border:0;background:var(--accent);color:var(--on-accent);font-weight:700;padding:0 26px;cursor:pointer;font-size:16px}
.a-more{display:flex;gap:20px;margin-top:12px;color:var(--muted);font-size:14px;flex-wrap:wrap}
.a-more button{background:none;border:0;padding:0;color:var(--ink);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
@media (max-width:760px){.a-form{grid-template-columns:1fr 1fr}.a-cell{border-bottom:1px solid var(--line)}.a-cell:nth-child(2n){border-right:0}.a-cell.wide{grid-column:span 2}.a-go{grid-column:span 2;padding:14px}}

.a-sum{position:sticky;top:0;z-index:5;background:var(--ink);color:var(--surface)}
.a-sum .wrap{display:flex;gap:18px;align-items:center;padding-top:10px;padding-bottom:10px;font-size:14px;flex-wrap:wrap}
.a-sum .route{font-weight:700;font-size:16px}
.a-sum button{margin-left:auto;background:transparent;border:1px solid currentColor;color:inherit;padding:5px 12px;cursor:pointer}
.a-head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;padding:28px 0 10px}
.a-head h2{margin:0;font-size:24px}
.a-head small{color:var(--muted);display:block;font-size:13px;margin-top:2px}
.a-board{background:var(--surface);border:1px solid var(--line)}
.a-row,.a-th{display:grid;grid-template-columns:minmax(0,2.2fr) 1.3fr 1.3fr .7fr 1fr 7.5rem;align-items:center;gap:12px;padding:0 14px}
.a-th{font-size:12px;color:var(--muted);height:34px;border-bottom:1px solid var(--line)}
.a-row{min-height:52px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer;font-size:15px}
.a-row:hover{background:color-mix(in srgb,var(--accent) 7%,transparent)}
.a-dest b{font-size:16px}
.a-dest span{color:var(--muted);font-size:13px;margin-left:6px}
.a-dest .n{display:block;margin-left:0;font-size:12px}
.a-price{justify-self:end;background:var(--tile);color:var(--tile-ink);padding:5px 8px;font-weight:700;font-size:17px;letter-spacing:.04em}
.a-price small{font-weight:400;font-size:12px;opacity:.75}
.a-sub{background:var(--bg);border-bottom:1px solid var(--line)}
.a-sub .a-row{cursor:default;min-height:44px;font-size:14px}
.a-sub .a-row:hover{background:none}
.a-sub .t{color:var(--muted)}
.a-row>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.a-row>.a-dest{white-space:normal}
.a-book{justify-self:end;color:var(--accent);font-weight:700;text-decoration:none;font-size:14px}
.a-moreRow{padding:10px 14px;font-size:14px}
.a-moreRow button,.a-showmore{background:none;border:1px solid var(--line);padding:8px 14px;cursor:pointer;color:var(--ink)}
.a-showmore{display:block;margin:16px auto 0;background:var(--surface)}
.a-mob{display:none}
@media (max-width:760px){
  .a-th{display:none}
  .a-row{grid-template-columns:1fr auto;padding:10px 14px;row-gap:2px}
  .a-row>.c-out,.a-row>.c-in,.a-row>.c-n,.a-row>.c-l{display:none}
  .a-mob{display:block;grid-column:1/-1;color:var(--muted);font-size:13px}
  .a-sub .a-row{grid-template-columns:1fr auto}
}
.a-empty{background:var(--surface);border:1px solid var(--line);padding:28px 20px;margin-top:28px}
.a-empty h2{margin:0 0 6px;font-size:22px}
.a-empty p{margin:0 0 18px;color:var(--muted)}
.a-empty .acts{display:flex;gap:8px;flex-wrap:wrap}
.a-empty .acts button{border:1px solid var(--ink);background:transparent;padding:9px 14px;cursor:pointer}
.a-empty .acts button:first-child{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

/* =====================================================================
   B — POCZTÓWKA: sentence form, postcards with airmail edge + price stamp
   ===================================================================== */
[data-v=b]{--bg:#EEF1F4;--card:#FFFFFF;--ink:#1E2430;--muted:#5E6675;--line:#D5DBE3;--red:#C4363F;--blue:#284B9B;--focus:#284B9B}
[data-v=b][data-t=dark]{--bg:#12161F;--card:#1B212D;--ink:#EEEAE2;--muted:#9AA1AE;--line:#2C3443;--red:#EE6A70;--blue:#8EA8F0;--focus:#8EA8F0}
[data-v=b]{background:var(--bg);color:var(--ink);font-family:'Figtree',system-ui,sans-serif}
.b-top{display:flex;justify-content:space-between;padding-block:20px;font-size:15px}
.b-top b{font-family:'Young Serif',serif;font-weight:400;font-size:19px}
.b-lang{color:var(--muted)} .b-lang b{font:600 15px 'Figtree';color:var(--ink)}
.b-sentence{max-width:46rem;margin:56px auto 0;font-family:'Young Serif',serif;font-size:clamp(26px,4.4vw,42px);line-height:1.55;text-align:left}
.b-blank{display:inline-block;border:0;border-bottom:2px solid var(--blue);background:transparent;padding:0 4px;margin:0 2px;color:var(--blue);cursor:pointer;font:inherit;line-height:1.2}
.b-blank.empty{color:var(--muted);border-bottom-style:dashed}
.b-actions{max-width:46rem;margin:28px auto 0;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.b-go{background:var(--red);color:#fff;border:0;border-radius:4px;padding:13px 22px;font-weight:600;font-size:16px;cursor:pointer}
[data-t=dark] .b-go{color:#1B0E10}
.b-link{background:none;border:0;padding:0;color:var(--muted);cursor:pointer;font-size:15px}
.b-link u{text-underline-offset:3px}
.b-sum{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.b-sum .wrap{display:flex;align-items:center;gap:14px;padding-top:12px;padding-bottom:12px;flex-wrap:wrap}
.b-sum p{margin:0;font-size:15px}
.b-sum p em{font-style:normal;color:var(--blue);font-weight:600}
.b-sum button{margin-left:auto;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:6px 12px;cursor:pointer}
.b-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin:32px 0 18px}
.b-head h2{font-family:'Young Serif',serif;font-weight:400;font-size:28px;margin:0}
.b-head small{color:var(--muted);font-size:14px}
.b-sort{font-size:14px;color:var(--muted)}
.b-sort button{background:none;border:0;padding:2px 4px;cursor:pointer;color:var(--muted)}
.b-sort button[aria-pressed=true]{color:var(--ink);text-decoration:underline;text-decoration-color:var(--red);text-decoration-thickness:2px;text-underline-offset:4px}
.b-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;grid-auto-flow:row dense}
@media (max-width:720px){.b-grid{grid-template-columns:1fr}}
.b-card{position:relative;background:var(--card);border-radius:3px;padding:26px 22px 18px;box-shadow:0 1px 0 var(--line);text-align:left;border:0;width:100%;cursor:pointer;color:inherit}
.b-card::before{content:"";position:absolute;left:0;right:0;top:0;height:7px;border-radius:3px 3px 0 0;
  background:repeating-linear-gradient(-45deg,var(--red) 0 12px,var(--card) 12px 18px,var(--blue) 18px 30px,var(--card) 30px 36px)}
.b-card.open{grid-column:1/-1;cursor:default}
.b-city{font-family:'Young Serif',serif;font-size:clamp(24px,3.4vw,32px);line-height:1.1;margin:0 7.5rem 4px 0}
.b-country{color:var(--muted);font-size:15px}
.b-stamp{position:absolute;top:22px;right:20px;width:6.4rem;padding:10px 6px;text-align:center;background:var(--bg);color:var(--red);
  border:2px dashed color-mix(in srgb,var(--red) 55%,transparent);transform:rotate(3deg);line-height:1.05}
.b-stamp small{display:block;font-size:12px;color:var(--muted)}
.b-stamp b{font-family:'Young Serif',serif;font-weight:400;font-size:26px}
.b-when{margin-top:22px;font-size:15px}
.b-meta{color:var(--muted);font-size:14px;margin-top:4px}
.b-foot{display:flex;justify-content:space-between;margin-top:16px;padding-top:12px;border-top:1px dashed var(--line);font-size:14px;color:var(--blue)}
.b-lines{margin-top:18px;border-top:1px solid var(--line)}
.b-line{display:grid;grid-template-columns:1fr auto auto;gap:18px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.b-line .t{color:var(--muted);font-size:14px}
.b-line b{font-weight:600}
.b-line a{color:var(--blue);font-weight:600;text-decoration:none}
@media (max-width:720px){.b-line{grid-template-columns:1fr auto}.b-line a{grid-column:2}}
.b-showmore{display:block;margin:26px auto 0;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:10px 18px;cursor:pointer}
.b-empty{max-width:40rem;margin:48px auto 0;text-align:left}
.b-empty h2{font-family:'Young Serif',serif;font-weight:400;font-size:30px;margin:0 0 10px}
.b-empty p{color:var(--muted);margin:0 0 20px;font-size:16px}
.b-empty .acts{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.b-empty .acts button{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:3px;padding:12px 16px;cursor:pointer;text-align:left;font-size:15px}

/* =====================================================================
   C — PLAKAT: price-first ranking, huge expanded numerals, magenta
   ===================================================================== */
[data-v=c]{--bg:#FFFFFF;--ink:#000000;--muted:#5C5C5C;--accent:#D1006F;--wash:#FFE3F0;--line:#000000;--focus:#D1006F}
[data-v=c][data-t=dark]{--bg:#000000;--ink:#FFFFFF;--muted:#A8A8A8;--accent:#FF5CA8;--wash:#2A0718;--line:#FFFFFF;--focus:#FF5CA8}
[data-v=c]{background:var(--bg);color:var(--ink);font-family:'Archivo',system-ui,sans-serif;font-variant-numeric:tabular-nums}
.c-top{display:flex;justify-content:space-between;padding:18px 0;font-size:15px;border-bottom:3px solid var(--line)}
.c-top b{font-weight:900;font-stretch:125%}
.c-hero{padding:44px 0 0}
.c-hero h1{font-size:clamp(40px,9vw,96px);line-height:.92;margin:0;font-weight:900;font-stretch:125%;letter-spacing:-.02em}
.c-hero h1 span{display:block;font-stretch:62%;font-weight:800}
.c-form{margin-top:30px;border:3px solid var(--line)}
.c-big{display:grid;grid-template-columns:1fr 1fr}
.c-big>div{padding:14px 16px;border-right:3px solid var(--line)}
.c-big>div:last-child{border-right:0}
.c-big label,.c-small label{display:block;font-size:13px;color:var(--muted)}
.c-big .v{font-size:clamp(22px,3.6vw,34px);font-weight:800;font-stretch:110%}
.c-big .ph{color:var(--muted);font-weight:500}
.c-small{display:grid;grid-template-columns:repeat(3,1fr) auto;border-top:3px solid var(--line)}
.c-small>div{padding:10px 16px;border-right:3px solid var(--line);font-size:17px;font-weight:600}
.c-go{border:0;background:var(--accent);color:#fff;font-weight:900;font-stretch:125%;font-size:18px;padding:0 28px;cursor:pointer}
[data-t=dark] .c-go{color:#000}
@media (max-width:720px){.c-big{grid-template-columns:1fr}.c-big>div{border-right:0;border-bottom:3px solid var(--line)}.c-big>div:last-child{border-bottom:0}
  .c-small{grid-template-columns:1fr 1fr}.c-small>div:nth-child(2){border-right:0}.c-small>div:nth-child(3){grid-column:1/-1;border-right:0;border-top:3px solid var(--line)}.c-go{grid-column:1/-1;padding:16px}}
.c-under{display:flex;gap:22px;margin-top:12px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.c-under button{background:none;border:0;padding:0;color:var(--ink);font-weight:700;cursor:pointer}
.c-sum{position:sticky;top:0;z-index:5;background:var(--accent);color:#fff}
[data-t=dark] .c-sum{color:#000}
.c-sum .wrap{display:flex;align-items:center;gap:16px;padding-top:10px;padding-bottom:10px;font-weight:700;flex-wrap:wrap}
.c-sum .r{font-stretch:125%;font-weight:900}
.c-sum button{margin-left:auto;background:var(--bg);color:var(--ink);border:0;padding:6px 14px;font-weight:800;cursor:pointer}
.c-head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;padding:30px 0 12px;border-bottom:3px solid var(--line)}
.c-head h2{margin:0;font-size:clamp(26px,4vw,40px);font-weight:900;font-stretch:62%;text-transform:none;line-height:1}
.c-head small{display:block;color:var(--muted);font-size:14px;margin-top:6px}
.c-sort{display:flex;border:3px solid var(--line)}
.c-sort button{border:0;background:transparent;padding:7px 12px;font-weight:700;cursor:pointer}
.c-sort button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.c-item{display:grid;grid-template-columns:minmax(9rem,13rem) 1fr auto;gap:18px;align-items:center;padding:16px 0;border-bottom:3px solid var(--line);width:100%;background:none;border-top:0;border-left:0;border-right:0;text-align:left;cursor:pointer;color:inherit}
.c-item:hover .c-p{color:var(--accent)}
.c-p{font-size:clamp(44px,7vw,72px);font-weight:900;font-stretch:125%;line-height:.9;letter-spacing:-.03em}
.c-p small{font-size:.32em;font-weight:700;letter-spacing:0;margin-left:2px}
.c-item.first .c-p{color:var(--accent)}
.c-name{font-size:clamp(20px,2.6vw,28px);font-weight:800;font-stretch:80%;line-height:1.05}
.c-name span{display:block;font-size:15px;font-weight:500;font-stretch:100%;color:var(--muted);margin-top:3px}
.c-when{font-size:15px;margin-top:8px}
.c-n{font-size:14px;font-weight:700;white-space:nowrap}
.c-open{background:var(--wash);padding:6px 16px 14px;border-bottom:3px solid var(--line)}
.c-tbl{width:100%;border-collapse:collapse;font-size:15px}
.c-tbl td{padding:9px 6px;border-bottom:1px solid color-mix(in srgb,var(--ink) 25%,transparent)}
.c-tbl td.pr{font-weight:900;font-stretch:115%;font-size:18px;text-align:right}
.c-tbl td.t{color:var(--muted);font-size:14px}
.c-tbl a{color:var(--accent);font-weight:800;text-decoration:none}
.c-tbl .hide-s{}
@media (max-width:720px){.c-item{grid-template-columns:auto 1fr}.c-n{grid-column:2}.c-tbl .hide-s{display:none}.c-tbl{font-size:14px}.c-tbl td{white-space:nowrap;padding:9px 3px}.c-open{padding-inline:8px}}
.c-showmore{display:block;width:100%;margin-top:0;border:0;border-bottom:3px solid var(--line);background:transparent;padding:16px;font-weight:900;font-stretch:125%;cursor:pointer}
.c-empty{padding:40px 0}
.c-empty h2{font-size:clamp(34px,7vw,64px);font-weight:900;font-stretch:62%;line-height:.95;margin:0 0 12px}
.c-empty p{color:var(--muted);margin:0 0 20px;font-size:17px;max-width:36rem}
.c-empty .acts{display:flex;gap:10px;flex-wrap:wrap}
.c-empty .acts button{border:3px solid var(--line);background:transparent;padding:10px 16px;font-weight:800;cursor:pointer}
.c-empty .acts button:first-child{background:var(--accent);border-color:var(--accent);color:#fff}
[data-t=dark] .c-empty .acts button:first-child{color:#000}
</style>
</head>
<body>
<div id="app" class="page"></div>
<div class="proto" role="toolbar" aria-label="Przełącznik prototypu">
  <button id="prev" aria-label="Poprzedni kierunek">←</button><span class="lbl" id="vlabel"></span><button id="next" aria-label="Następny kierunek">→</button>
  <span class="sep"></span>
  <button data-state="form">Formularz</button><button data-state="results">Wyniki</button><button data-state="empty">Pusty</button>
  <span class="sep"></span>
  <button data-theme="light">Jasny</button><button data-theme="dark">Ciemny</button>

function sync(){

  const t=S.theme==='auto'?(sysDark()?'dark':'light'):S.theme;
  document.documentElement.dataset.v=S.v;document.documentElement.dataset.t=t;
  document.getElementById('vlabel').textContent=VN[S.v];
  document.querySelectorAll('[data-state]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.state===S.state));
  document.querySelectorAll('[data-theme]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.theme===t));

}

R.b.results=()=>`${bTop()}${bSum()}<main class="wrap">
 <div class="b-head"><div><h2>${DATA.places} miejsc, ${zl(DATA.total)} ofert</h2><small>Ceny za osobę, bez bagażu kabinowego</small></div>
 <div class="b-sort">Sortuj: <button aria-pressed="true">cena</button> <button aria-pressed="false">dni urlopu</button></div></div>
 <div class="b-grid">${groups().map(g=>{const o=g.offers[0],op=S.open.has(g.code);return `
  <article class="b-card ${op?'open':''}" ${op?'':`role="button" tabindex="0" aria-expanded="false" onclick="tog('${g.code}')"`}>
   <h3 class="b-city">${nm(g)}</h3><div class="b-country">${g.countryPl}, lotnisko ${g.code}</div>
   <div class="b-stamp"><small>od</small><b>${zl(o.price)}</b><small>zł</small></div>
   ${op?`<div class="b-lines">${g.offers.slice(0,5).map(x=>`<div class="b-line"><div><b>${d(x.out.d)} – ${d(x.in.d)}</b><div class="t">${x.out.t1} wylot, ${x.in.t1} powrót, ${nights(x.nights)}, ${leave(x.leave)}</div></div><b>${zl(x.price)} zł</b><a href="#">Rezerwuj ↗</a></div>`).join('')}</div>
    <div class="b-foot"><button class="b-link" onclick="tog('${g.code}')"><u>Zwiń</u></button><span>Pokaż wszystkie ${terms(g.count)}</span></div>`
   :`<div class="b-when">${d(o.out.d)} – ${d(o.in.d)}</div><div class="b-meta">${nights(o.nights)}, ${leave(o.leave)}</div>
    <div class="b-foot"><span>jeszcze ${terms(g.count-1)}</span><span>Zobacz terminy</span></div>`}
  </article>`}).join('')}</div>
 <button class="b-showmore" onclick="more()">Pokaż więcej miejsc</button>
</main>`;
R.b.empty=()=>`${bTop()}<div class="b-sum"><div class="wrap"><p>Z <em>Krakowa</em> do <em>Triestu</em>, <em>20 lis – 30 lis</em>, <em>4–5 nocy</em></p><button onclick="go('form')">Zmień</button></div></div><main class="wrap">
 <div class="b-empty"><h2>Do Triestu w tych dniach nic nie leci</h2><p>Między 20 a 30 listopada żadna para lotów nie daje 4–5 nocy. Każda z tych zmian coś znajduje:</p>
 <div class="acts"><button>Poszerz daty do 13 grudnia</button><button>Pozwól na 2–5 nocy</button><button>Pokaż wszystkie kierunki z Krakowa</button></div></div></main>`;

/* ---------------- C ---------------- */
const cTop=()=>`<div class="wrap"><div class="c-top"><b>gocitybreak</b><span><b>PL</b> | EN</span></div></div>`;
R.c.form=()=>`${cTop()}<main class="wrap">
 <div class="c-hero"><h1>Weekend za grosze<span>Najtańsze loty na 2–4 dni</span></h1></div>
 <form class="c-form" onsubmit="event.preventDefault();go('results')">
  <div class="c-big"><div><label>Skąd</label><div class="v ph">Wybierz lotnisko</div></div><div><label>Dokąd</label><div class="v">Gdziekolwiek</div></div></div>
  <div class="c-small"><div><label>Najwcześniej</label>pt 15 lis</div><div><label>Najpóźniej</label>pt 10 sty</div><div><label>Noce</label>2–3</div><button class="c-go">Szukaj</button></div>
 </form>
 <div class="c-under"><span>Tam i z powrotem, elastyczne daty</span><button>Filtry</button><button>Urlop</button></div>
</main>`;
const cSum=()=>`<div class="c-sum"><div class="wrap"><span class="r">${SUM.route}</span><span>${SUM.dates}</span><span>${SUM.n}</span><button onclick="go('form')">Zmień</button></div></div>`;
R.c.results=()=>`${cTop()}${cSum()}<main class="wrap">
 <div class="c-head"><div><h2>${DATA.places} miejsc od ${zl(DATA.groups[0].offers[0].price)} zł</h2><small>${zl(DATA.total)} ofert, ceny za osobę, bez bagażu kabinowego</small></div>
 <div class="c-sort"><button aria-pressed="true">Cena</button><button aria-pressed="false">Dni urlopu</button></div></div>
 ${groups().map((g,i)=>{const o=g.offers[0],op=S.open.has(g.code);return `
 <button class="c-item ${i===0?'first':''}" aria-expanded="${op}" onclick="tog('${g.code}')">
  <span class="c-p">${zl(o.price)}<small>zł</small></span>
  <span><span class="c-name">${nm(g)}<span>${g.countryPl}, ${g.code}</span></span><span class="c-when">${d(o.out.d)} – ${d(o.in.d)}, ${nights(o.nights)}, ${leave(o.leave)}</span></span>
  <span class="c-n">${op?'Zwiń':'+ '+terms(g.count-1)}</span>
 </button>${op?`<div class="c-open"><table class="c-tbl">${g.offers.slice(0,5).map(x=>`<tr><td>${d(x.out.d)} – ${d(x.in.d)}</td><td class="t hide-s">${x.out.t1} / ${x.in.t1}</td><td class="t hide-s">${nights(x.nights)}, ${leave(x.leave)}</td><td class="pr">${zl(x.price)} zł</td><td><a href="#">Rezerwuj ↗</a></td></tr>`).join('')}</table></div>`:''}`}).join('')}
 <button class="c-showmore" onclick="more()">Pokaż więcej miejsc</button>
</main>`;
R.c.empty=()=>`${cTop()}<div class="c-sum"><div class="wrap"><span class="r">Kraków → Triest</span><span>20 lis – 30 lis</span><span>4–5 nocy</span><button onclick="go('form')">Zmień</button></div></div><main class="wrap">
 <div class="c-empty"><h2>Zero lotów do Triestu w tych dniach</h2><p>Między 20 a 30 listopada żadna para lotów nie daje 4–5 nocy. Zmień jedno z poniższych:</p>
 <div class="acts"><button>Poszerz daty do 13 gru</button><button>2–5 nocy</button><button>Gdziekolwiek z Krakowa</button></div></div></main>`;

function go(s){S.state=s;sync()}
function tog(c){S.open.has(c)?S.open.delete(c):S.open.add(c);const y=scrollY;sync();scrollTo(0,y)}
function more(){S.shown+=8;const y=scrollY;sync();scrollTo(0,y)}
const order=['a','b','c'];
document.getElementById('prev').onclick=()=>{S.v=order[(order.indexOf(S.v)+2)%3];sync()};
document.getElementById('next').onclick=()=>{S.v=order[(order.indexOf(S.v)+1)%3];sync()};
document.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>go(b.dataset.state));
document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{S.theme=b.dataset.theme;sync()});
addEventListener('keydown',e=>{if(e.target.closest('input,textarea,[contenteditable]'))return;if(e.key==='ArrowLeft')document.getElementById('prev').click();if(e.key==='ArrowRight')document.getElementById('next').click()});
addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role=button][onclick]')){e.preventDefault();e.target.click()}});
sync();
</script>
</body>
</html>

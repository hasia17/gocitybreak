<main>
  <h1>gocitybreak</h1>
  <app-search />
</main>

<footer>
  @if (apiStatus.hasValue()) {
    @let status = apiStatus.value();
    <ul>
      <li>API: {{ status.status }}</li>
      <li>Version: {{ status.version }}</li>
      <li>Database: {{ status.database.status }}</li>
    </ul>
  } @else if (apiStatus.error()) {
    <p role="alert">API unavailable.</p>
  } @else {
    <p>Checking API…</p>
  }
</footer>

<ng-container *transloco="let t">
  <header>
    <p class="brand"><img src="favicon.svg" alt="" width="20" height="20" />gocitybreak</p>
    <nav class="languages" [attr.aria-label]="t('app.language')">
      @for (code of languages; track code; let last = $last) {
        <button
          type="button"
          [lang]="code"
          [attr.aria-pressed]="language.current() === code"
          (click)="language.use(code)"
        >
          {{ code.toUpperCase() }}
        </button>
        @if (!last) {
          <span aria-hidden="true">|</span>
        }
      }
    </nav>
  </header>

  <main>
    <app-search />
  </main>
</ng-container>

@if (offers().length > 0) {
  <header class="results-head">
    <h2>{{ heading() }}</h2>
    <span>{{ t('results.perPerson') }}</span>
    @if (showSort()) {
      <!-- Sorting reorders the found offers at once, so it sits with them, not in the form. -->
      <div class="sort">
        <span aria-hidden="true">{{ t('search.sort') }}</span>
        <div class="toggle" role="radiogroup" [attr.aria-label]="t('search.sortBy')">
          <label
            ><input type="radio" name="sort" [formControl]="sort()" value="price" />{{
              t('search.sortOrder.price')
            }}</label
          >
          <label
            ><input type="radio" name="sort" [formControl]="sort()" value="leaveDays" />{{
              t('search.sortOrder.leaveDays')
            }}</label
          >
        </div>
      </div>
    }
  </header>
  @if (groups(); as groups) {
    <app-destination-group-list
      [groups]="groups"
      [pageKey]="pageKey()"
      [texts]="texts()"
      (pageAdded)="staggering.set(false)"
    />
  } @else {
    <ol class="offers">
      @for (offer of visibleOffers(); track $index) {
        <li
          app-offer
          [style.--enter-index]="enterIndex($index)"
          [attr.data-added]="addedByShowMore($index) ? '' : null"
          [offer]="offer"
          [texts]="texts()"
        ></li>
      }
    </ol>
    @if (page.shown() < offers().length) {
      <button class="show-more" type="button" (click)="showMore()">
        {{ t('results.showMore') }}
      </button>
    }
  }
}

# Local environment: `docker compose up --build`, then open http://localhost:8080.
name: gocitybreak

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gocitybreak
      POSTGRES_USER: gocitybreak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gocitybreak}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gocitybreak -d gocitybreak"]
      interval: 2s
      timeout: 5s
      retries: 15

  backend:
    build:
      context: ./backend
      args:
        VERSION: ${VERSION:-dev}
    environment:
      DATABASE_URL: postgres://gocitybreak:${POSTGRES_PASSWORD:-gocitybreak}@postgres:5432/gocitybreak?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # The price worker (ADR-0002): fetches Ryanair and Wizz Air prices and NBP rates in the background, each airline
  # at its own rate. Near months are refetched every 12 h, far ones weekly (worker.DefaultFreshness); search works on
  # whatever is stored. WIZZAIR_URL and WIZZAIR_API_VERSION left empty take the worker's defaults.
  worker:
    build:
      context: ./backend
      args:
        VERSION: ${VERSION:-dev}
    entrypoint: ["/worker"]
    environment:
      DATABASE_URL: postgres://gocitybreak:${POSTGRES_PASSWORD:-gocitybreak}@postgres:5432/gocitybreak?sslmode=disable
      RYANAIR_REQUESTS_PER_SECOND: ${RYANAIR_REQUESTS_PER_SECOND:-1}
      WIZZAIR_REQUESTS_PER_SECOND: ${WIZZAIR_REQUESTS_PER_SECOND:-1}
      WIZZAIR_URL: ${WIZZAIR_URL:-}
      WIZZAIR_API_VERSION: ${WIZZAIR_API_VERSION:-}
      PRICE_REFRESH_PAUSE: ${PRICE_REFRESH_PAUSE:-10m}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:

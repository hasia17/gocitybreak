name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # On main, let every run finish so a deploy is never cut off halfway.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go vet ./...
      # Modern Go (AGENTS.md § Go code): go fix -diff exits 0 even with pending rewrites, so fail on any output.
      - name: go fix
        run: |
          diff=$(go fix -diff ./...)
          if [ -n "$diff" ]; then
            echo "$diff"
            echo "::error::go fix would modernize this code: run 'go fix ./...' in backend/ and commit the result"
            exit 1
          fi
      # Tests start a real PostgreSQL in Docker via testcontainers.
      - run: go test -race ./...

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false
      - run: npm run build

  images:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose build

  # Deployment (docs/deploy.md): only for pushes to main that change what is deployed.
  changes:
    name: Detect deployable changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.diff.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Compare the push with the previous tip of main
        id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            # No previous commit to compare with (e.g. a force push): deploy to be safe.
            deploy=true
          elif git diff --quiet "$BEFORE" "$GITHUB_SHA" -- backend frontend deploy .github/workflows; then
            deploy=false
          else
            deploy=true
          fi
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          echo "Deploy: $deploy"

  # Only after the tests above pass.
  publish:
    name: Publish ${{ matrix.service }} image
    if: needs.changes.outputs.deploy == 'true'
    needs: [changes, backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service }}
          platforms: linux/amd64
          push: true
          build-args: ${{ matrix.service == 'backend' && format('VERSION={0}', github.sha) || '' }}
          tags: ghcr.io/hasia17/gocitybreak-${{ matrix.service }}:${{ github.sha }}
          # Links the package to this repo, so jobs here can pull it with GITHUB_TOKEN.
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy to VPS
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      VERSION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ vars.DEPLOY_HOST }}
          PORT: ${{ vars.DEPLOY_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host vps\n  HostName %s\n  Port %s\n  User root\n  IdentityFile ~/.ssh/deploy_key\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n' "$HOST" "$PORT" > ~/.ssh/config
      - name: Upload compose file
        run: scp deploy/compose.yml vps:/opt/gocitybreak/compose.yml
      # The repo is private, so the server logs in to GHCR with this job's short-lived token and logs out at the end.
      - name: Log the server in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          # shellcheck disable=SC2029 # GHCR_USER is meant to expand here, on the runner.
          printf '%s\n' "$GHCR_TOKEN" | ssh vps "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
      - name: Pull and start the new version
        run: |
          # shellcheck disable=SC2029 # VERSION is meant to expand here, on the runner.
          ssh vps "VERSION=$VERSION bash -s" <<'EOF'
          set -euo pipefail
          cd /opt/gocitybreak
          previous=$(sed -n 's/^VERSION=//p' .env)
          sed -i '/^VERSION=/d' .env
          echo "VERSION=$VERSION" >> .env
          docker compose pull --quiet backend frontend
          docker compose up -d --remove-orphans
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:20369/api/status | grep -q "^{\"status\":\"ok\",\"version\":\"$VERSION\""; then
              echo "Deployed $VERSION (previous: $previous)"
              # Keep recent images for a quick local rollback; older ones can be pulled again from GHCR.
              docker image prune -af --filter until=240h >/dev/null
              exit 0
            fi
            sleep 2
          done
          echo "::error::$VERSION did not report healthy on /api/status (previous: $previous)"
          docker compose ps
          docker compose logs --tail=50 backend
          exit 1
          EOF
      - name: Log the server out of GHCR
        if: always()
        run: ssh vps "docker logout ghcr.io" || true
